// ========== IndexedDB 媒体存储 ==========
let db = null;
const initDB = () => new Promise((resolve, reject) => {
  const req = indexedDB.open(DB_NAME, DB_VERSION);
  req.onerror = () => reject('无法打开数据库');
  req.onsuccess = () => { db = req.result; resolve(db); };
  req.onupgradeneeded = e => {
    const d = e.target.result;
    if (!d.objectStoreNames.contains('media')) {
      const store = d.createObjectStore('media', { keyPath: 'id' });
      store.createIndex('type', 'type', { unique: false });
    }
  };
});

const saveMediaToDB = (id, { type, name, size, blob }) => new Promise((resolve, reject) => {
  if (!db) return reject('数据库未初始化');
  const tx = db.transaction('media', 'readwrite');
  const store = tx.objectStore('media');
  const req = store.put({ id, type, name, size, blob, timestamp: Date.now() });
  req.onsuccess = () => resolve();
  req.onerror = () => reject('保存失败');
});

const getMediaFromDB = id => new Promise((resolve, reject) => {
  if (!db) return reject('数据库未初始化');
  const tx = db.transaction('media', 'readonly');
  const store = tx.objectStore('media');
  const req = store.get(id);
  req.onsuccess = () => resolve(req.result);
  req.onerror = () => reject('读取失败');
});

// 从媒体记录获取可显示的 URL（兼容旧 data URL 和新 Blob）
const getMediaDisplayURL = (record) => {
  if (!record) return null;
  if (record.blob) return URL.createObjectURL(record.blob);
  if (record.data) return record.data;
  return null;
};

const revokeMediaURL = (url) => {
  if (url && url.startsWith('blob:')) URL.revokeObjectURL(url);
};

const deleteMediaFromDB = id => new Promise((resolve, reject) => {
  if (!db) return reject('数据库未初始化');
  const tx = db.transaction('media', 'readwrite');
  const store = tx.objectStore('media');
  const req = store.delete(id);
  req.onsuccess = () => resolve();
  req.onerror = () => reject('删除失败');
});

const getTotalMediaSize = () => new Promise((resolve, reject) => {
  if (!db) return resolve(0);
  const tx = db.transaction('media', 'readonly');
  const store = tx.objectStore('media');
  const req = store.getAll();
  req.onsuccess = () => { const total = req.result.reduce((sum, m) => sum + (m.size || 0), 0); resolve(total); };
  req.onerror = () => reject('计算大小失败');
});

  try {

  if (typeof EMBEDDED_DATA !== 'undefined') return {...defaultState, ...EMBEDDED_DATA};

}

function saveState(s) {

function PersonalSection({state,setState}) {

  const removeAvatar = async () => {
    try { await deleteMediaFromDB('avatar'); } catch {}
    revokeMediaURL(avatarUrl);
    setAvatarUrl(null);
    setState(s => { const ns = {...s}; delete ns.avatar; return ns; });

// ========== 轮播管理（图片存储到 IndexedDB） ==========
function CarouselSection({state,setState}) {
  const [slides, setSlides] = useState(state.carouselSlides || []);
  const [imgCache, setImgCache] = useState({});

  // 从 IndexedDB 加载轮播背景图
  useEffect(() => {
    (state.carouselSlides||[]).forEach(s => {
      if (s.bgImage) {
        getMediaFromDB(`carousel_${s.id}`).then(r => {
          const url = getMediaDisplayURL(r);
          if (url) setImgCache(m => ({...m, [s.id]: url}));
        }).catch(() => {});
      }
    });
  }, []);

  const update = (i,k,v) => setSlides(c=>{const n=[...c]; n[i]={...n[i],[k]:v}; return n;});
  const add = () => setSlides(c=>[...c, {id:Date.now(), tag:'New Tag', heading:'标题<br/>副标题', subheading:'', bottom:'底部文字', bgGradient:'linear-gradient(135deg, #fce8e8 0%, #faf8f5 50%, #e8faf0 100%)'}]);
  const remove = async i => {
    const sid = slides[i]?.id;
    if (sid) {
      try { await deleteMediaFromDB(`carousel_${sid}`); } catch {}
    }
    setSlides(c=>c.filter((_,idx)=>idx!==i));
  };

  const handleImage = async (i, file) => {
    if (!file) return;
    if (file.size > MAX_FILE_SIZE) { showToast('文件过大', true); return; }
    const sid = slides[i].id;
    const url = URL.createObjectURL(file);
    setImgCache(m => ({...m, [sid]: url}));
    try {
      await saveMediaToDB(`carousel_${sid}`, { type:'image', name:file.name, size:file.size, blob:file });
    } catch(e) { showToast('图片持久化失败: '+e, true); }
    setSlides(c => { const n = [...c]; n[i] = {...n[i], bgImage: {name:file.name, size:file.size}}; return n; });
    showToast(`${file.name} 已上传`);
  };

  const removeImage = async i => {
    const sid = slides[i].id;
    try { await deleteMediaFromDB(`carousel_${sid}`); } catch {}
    revokeMediaURL(imgCache[sid]);
    const nc = {...imgCache}; delete nc[sid]; setImgCache(nc);
    setSlides(c => { const n = [...c]; const s = {...n[i]}; delete s.bgImage; n[i]=s; return n; });
  };

  const [dragIdx, setDragIdx] = useState(null);
  const moveItem = (from, to) => setSlides(s => { const n = [...s]; const [rm] = n.splice(from, 1); n.splice(to, 0, rm); return n; });
  const handleDragOver = (e, i) => { e.preventDefault(); if (dragIdx !== null && dragIdx !== i) { moveItem(dragIdx, i); setDragIdx(i); } };
  const handleDragEnd = () => setDragIdx(null);

  useEffect(()=>{setState(s=>({...s, carouselSlides:slides}))}, [slides]);

  return (
    <div className="section-card">
      <div className="section-title"><span>轮播页管理</span><button className="btn btn-primary btn-sm" onClick={add}>+ 添加轮播页</button></div>

        {slides.map((s,i)=>(
          <div key={s.id} className={`bg-surface p-3 rounded-md space-y-2 drag-item ${dragIdx===i?'dragging':''}`}
            onDragOver={e=>handleDragOver(e,i)}
            onDragEnd={handleDragEnd}
            onDrop={e=>{e.preventDefault();setDragIdx(null);}}>
            <div className="flex items-center gap-2 justify-between">
              <div className="flex items-center gap-2">
                <span className="drag-handle" draggable onDragStart={e=>{setDragIdx(i);e.dataTransfer.effectAllowed='move';}}>⋮⋮</span>
                <span className="font-bold text-sm">轮播 #{i+1}</span>
              </div>
              <button className="btn btn-danger btn-sm" onClick={()=>remove(i)}>删除</button>
            </div>
            <div className="grid-form">
              <div><label>标签文字（Tag）</label><input type="text" value={s.tag} onChange={e=>update(i,'tag',e.target.value)}/></div>
              <div><label>主标题（支持 &lt;br/&gt;）</label><input type="text" value={s.heading} onChange={e=>update(i,'heading',e.target.value)}/></div>
              <div><label>副标题</label><input type="text" value={s.subheading} onChange={e=>update(i,'subheading',e.target.value)}/></div>
              <div><label>底部文字</label><input type="text" value={s.bottom} onChange={e=>update(i,'bottom',e.target.value)}/></div>
              <div className="col-span-2"><label>背景渐变色（CSS gradient）</label><input type="text" value={s.bgGradient} onChange={e=>update(i,'bgGradient',e.target.value)}/></div>
            </div>
            <div className={`upload-zone ${s.bgImage?'has-file':''}`} onClick={()=>document.getElementById(`cs-upload-${i}`).click()}>
              <input id={`cs-upload-${i}`} type="file" accept="image/*" className="hidden" onChange={e=>handleImage(i, e.target.files[0])}/>
              {s.bgImage ? (
                <div>
                  <span className="text-accent2 text-sm">背景图 — {s.bgImage.name} ({(s.bgImage.size/1024/1024).toFixed(1)}MB)</span>
                  {imgCache[s.id] && <img src={imgCache[s.id]} className="media-preview"/>}
                </div>
              ) : <span className="text-muted text-sm">点击上传背景图片（可选，留空使用渐变色）</span>}
            </div>
            {s.bgImage && <button className="btn btn-danger btn-sm w-full mt-2" onClick={()=>removeImage(i)}>移除背景图</button>}
          </div>
        ))}
      </div>
    </div>
  );
}

// ========== 作品集管理（带拖拽排序） ==========
function PortfolioSection({state,setState}) {
  const pm = state.portfolioMeta || {};
  const [mediaCache, setMediaCache] = useState({});
  const [totalSize, setTotalSize] = useState(0);
  const [loading, setLoading] = useState({});

  useEffect(() => { getTotalMediaSize().then(s => setTotalSize(s)).catch(() => {}); }, [state.portfolioMedia]);

  const updateMeta = (id,k,v) => setState(s=>({...s, portfolioMeta:{...s.portfolioMeta, [id]:{...s.portfolioMeta[id], [k]:v}}}));

  const handleFile = async (id, file) => {
    if (!file) return;
    if (file.size > MAX_FILE_SIZE) { showToast(`文件过大(${(file.size/1024/1024).toFixed(1)}MB)`, true); return; }
    setLoading(l => ({...l, [id]: true}));
    const ext = file.name.split('.').pop().toLowerCase();
    let type = 'image';
    if (['mp4','mov'].includes(ext)) type = 'video';
    else if (ext === 'gif') type = 'gif';
    else if (['mp3','wav','ogg'].includes(ext)) type = 'audio';
    try {
      const url = URL.createObjectURL(file);
      saveMediaToDB(id, { type, name: file.name, size: file.size, blob: file }).then(() => {
        setMediaCache(m => ({...m, [id]: url}));
        setState(s => ({...s, portfolioMedia:{...s.portfolioMedia, [id]:{type, name:file.name, size:file.size}}}));
        showToast(`${file.name} 已上传 (${(file.size/1024/1024).toFixed(1)}MB)`);
      }).catch(e => showToast('持久化失败: '+e, true));
      setLoading(l => ({...l, [id]: false}));
    } catch (e) { showToast('上传失败: ' + e, true); setLoading(l => ({...l, [id]: false})); }
  };

  const removeMedia = async id => {
    try { await deleteMediaFromDB(id); } catch {}
    revokeMediaURL(mediaCache[id]);
    const newCache = {...mediaCache}; delete newCache[id]; setMediaCache(newCache);
    setState(s => { const m = {...s.portfolioMedia}; delete m[id]; return {...s, portfolioMedia:m}; });
    showToast('文件已移除');
  };

  const addPortfolio = () => {
    const ids = Object.keys(pm).map(Number);
    const newId = ids.length > 0 ? Math.max(...ids) + 1 : 1;
    setState(s => ({
      ...s,
      portfolioMeta:{...s.portfolioMeta, [newId]:{title:'新作品', cat:'分类', desc:'描述', color:'#fce8e8'}},
      portfolioOrder:[...(s.portfolioOrder||Object.keys(s.portfolioMeta||{}).map(Number)), newId]
    }));
  };

  const removePortfolio = async id => {
    if (!confirm('确定删除这个作品？')) return;
    await removeMedia(id);
    setState(s => {
      const meta = {...s.portfolioMeta}; delete meta[id];
      const media = {...s.portfolioMedia}; delete media[id];
      const order = (s.portfolioOrder||[]).filter(x=>x!==id);
      return {...s, portfolioMeta:meta, portfolioMedia:media, portfolioOrder:order};
    });
  };

  const rawIds = Object.keys(pm).map(Number);
  const order = state.portfolioOrder || rawIds.sort((a,b)=>a-b);
  const ids = order.filter(id => pm[id] != null);

  const [dragIdx, setDragIdx] = useState(null);
  const moveItem = (from, to) => {
    setState(s => {
      const arr = [...(s.portfolioOrder||ids)];
      const [rm] = arr.splice(from, 1);
      arr.splice(to, 0, rm);
      return {...s, portfolioOrder:arr};
    });
  };
  const handleDragOver = (e, i) => { e.preventDefault(); if (dragIdx !== null && dragIdx !== i) { moveItem(dragIdx, i); setDragIdx(i); } };
  const handleDragEnd = () => setDragIdx(null);

  return (
    <div className="section-card">
      <div className="section-title"><span>作品集管理</span><button className="btn btn-primary btn-sm" onClick={addPortfolio}>+ 添加作品</button></div>
      <p className="text-xs text-muted mb-4">支持 JPG/PNG/MP4/MOV/GIF/MP3 · 单文件≤600MB · 已用 {(totalSize/1024/1024).toFixed(1)}MB · 拖动卡片排序</p>
      <div className="portfolio-grid">
        {ids.map((id, idx) => {
          const m = pm[id] || {title:'', cat:'', desc:'', color:'#fce8e8'};
          const media = state.portfolioMedia?.[id];
          const src = mediaCache[id];
          const isLoad = loading[id];
          return (
            <div key={id} className={`bg-surface p-3 rounded-md space-y-2 drag-item ${dragIdx===idx?'dragging':''}`}
              onDragOver={e=>handleDragOver(e,idx)}
              onDragEnd={handleDragEnd}
              onDrop={e=>{e.preventDefault();setDragIdx(null);}}>
              <div className="flex items-center justify-between">
                <div className="flex items-center gap-2">
                  <span className="drag-handle" draggable onDragStart={e=>{setDragIdx(idx);e.dataTransfer.effectAllowed='move';}}>⋮⋮</span>
                  <span className="font-bold text-sm">作品 #{idx+1}</span>
                </div>
                <button className="btn btn-danger btn-sm" onClick={()=>removePortfolio(id)}>删除</button>
              </div>
              <div><label>标题</label><input type="text" value={m.title} onChange={e=>updateMeta(id,'title',e.target.value)}/></div>
              <div><label>分类</label><input type="text" value={m.cat} onChange={e=>updateMeta(id,'cat',e.target.value)}/></div>
              <div><label>描述</label><textarea value={m.desc} onChange={e=>updateMeta(id,'desc',e.target.value)}/></div>
              <div><label>背景色</label><input type="text" value={m.color} onChange={e=>updateMeta(id,'color',e.target.value)}/></div>
              <div className={`upload-zone ${media?'has-file':''}`} onClick={()=>!isLoad && document.getElementById(`pf-upload-${id}`).click()}>
                <input id={`pf-upload-${id}`} type="file" accept="image/*,video/mp4,video/quicktime,image/gif,audio/mpeg,audio/wav,audio/ogg" className="hidden" onChange={e=>handleFile(id, e.target.files[0])}/>
                {isLoad ? <div className="text-accent2 text-sm">上传中...</div> : media ? <>
                  <span className="text-accent2 text-sm">{media.type==='video'?'视频':media.type==='audio'?'音频':media.type==='gif'?'GIF':'图片'} — {media.name} ({(media.size/1024/1024).toFixed(1)}MB)</span>
                  {media.type==='image' && src && <img src={src} className="media-preview"/>}
                  {media.type==='video' && src && <video src={src} className="media-preview" controls/>}
                  {media.type==='gif' && src && <img src={src} className="media-preview"/>}
                  {media.type==='audio' && src && <audio src={src} className="mt-2 w-full" controls/>}
                </> : <span className="text-muted text-sm">点击上传 (图片/视频/音频/GIF)</span>}
              </div>
              {media && <button className="btn btn-danger btn-sm w-full mt-2" onClick={()=>removeMedia(id)}>移除文件</button>}
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ========== 动态展示管理（带文件上传 + 封面图片） ==========
function DemoReelSection({state,setState}) {
  const [clips, setClips] = useState(state.demoReel || []);
  const update = (i,k,v) => setClips(c=>{const n=[...c]; n[i]={...n[i],[k]:v}; return n;});
  const add = () => setClips(c=>[...c, {id:Date.now(), title:'新片段', desc:'描述', color:'#fce8e8', emoji:'◉', duration:'00:00'}]);
  const remove = i => { const c=clips[i]; setClips(c=>c.filter((_,idx)=>idx!==i)); if(c) { removeDemoMedia(c.id); removeDemoCover(c.id); } };
  useEffect(()=>{setState(s=>({...s, demoReel:clips}))}, [clips]);
  const [mediaCache, setMediaCache] = useState({});
  const [loading, setLoading] = useState({});
  const [coverCache, setCoverCache] = useState({});
  const [coverLoading, setCoverLoading] = useState({});

  // 初始化时加载已有封面
  useEffect(()=>{
    const coverage = state.demoCoverMedia || {};
    const keys = Object.keys(coverage);
    keys.forEach(id => {
      getMediaFromDB(`drCover_${id}`).then(r => {
        const u = getMediaDisplayURL(r);
        if (u) setCoverCache(c => ({...c, [id]: u}));
      }).catch(()=>{});
    });
  }, []);

  const removeDemoMedia = async id => {
    try { await deleteMediaFromDB(`demo_${id}`); } catch {}
    revokeMediaURL(mediaCache[id]);
    const newCache = {...mediaCache}; delete newCache[id]; setMediaCache(newCache);
    setState(s => { const m = {...s.demoReelMedia}; delete m[id]; return {...s, demoReelMedia:m}; });
  };

  const removeDemoCover = async id => {
    try { await deleteMediaFromDB(`drCover_${id}`); } catch {}
    revokeMediaURL(coverCache[id]);
    const newCache = {...coverCache}; delete newCache[id]; setCoverCache(newCache);
    setState(s => { const m = {...s.demoCoverMedia}; delete m[id]; return {...s, demoCoverMedia:m}; });
  };

  const handleDemoFile = async (id, file) => {
    if (!file) return;
    if (file.size > MAX_FILE_SIZE) { showToast(`文件过大(${(file.size/1024/1024).toFixed(1)}MB)`, true); return; }
    setLoading(l => ({...l, [id]: true}));
    const ext = file.name.split('.').pop().toLowerCase();
    let type = 'video';
    if (['jpg','jpeg','png','webp'].includes(ext)) type = 'image';
    else if (ext === 'gif') type = 'gif';
    try {
      const url = URL.createObjectURL(file);
      saveMediaToDB(`demo_${id}`, { type, name: file.name, size: file.size, blob: file }).then(() => {
        setMediaCache(m => ({...m, [id]: url}));
        setState(s => ({...s, demoReelMedia:{...s.demoReelMedia, [id]:{type, name:file.name, size:file.size}}}));
        showToast(`${file.name} 已上传`);
      }).catch(e => showToast('持久化失败: '+e, true));
      setLoading(l => ({...l, [id]: false}));
    } catch (e) { showToast('上传失败: ' + e, true); setLoading(l => ({...l, [id]: false})); }
  };

  const handleDemoCover = async (id, file) => {
    if (!file) return;
    setCoverLoading(l => ({...l, [id]: true}));
    const ext = file.name.split('.').pop().toLowerCase();
    try {
      const url = URL.createObjectURL(file);
      await saveMediaToDB(`drCover_${id}`, { type:'image', name: file.name, size: file.size, blob: file });
      setCoverCache(m => ({...m, [id]: url}));
      setState(s => ({...s, demoCoverMedia:{...s.demoCoverMedia, [id]:{name:file.name, size:file.size}}}));
      showToast(`封面 ${file.name} 已上传`);
    } catch (e) { showToast('封面上传失败: '+e, true); }
    setCoverLoading(l => ({...l, [id]: false}));
  };

  return (
    <div className="section-card">
      <div className="section-title"><span>动态展示片段</span><button className="btn btn-primary btn-sm" onClick={add}>+ 添加片段</button></div>
      <p className="text-xs text-muted mb-4">编辑 Demo Reel 片段信息，支持上传视频/图片文件与封面图片（≤600MB）</p>
      <div className="space-y-4">
        {clips.map((c,i)=>{
          const media = state.demoReelMedia?.[c.id];
          const src = mediaCache[c.id];
          const isLoad = loading[c.id];
          const coverSrc = coverCache[c.id];
          const isCoverLoad = coverLoading[c.id];
          const hasCover = state.demoCoverMedia?.[c.id] || coverSrc;
          return (
          <div key={c.id} className="bg-surface p-3 rounded-md space-y-2">
            <div className="flex justify-between items-center">
              <div className="flex items-center gap-2">
                {coverSrc ? <img src={coverSrc} className="w-8 h-8 rounded-sm shadow-sm object-cover"/> : <span className="w-8 h-8 rounded-sm flex items-center justify-center shadow-sm" style={{backgroundColor:c.color}}><span className="text-base">{c.emoji}</span></span>}
                <span className="font-bold text-sm">片段 #{i+1}</span>
              </div>
              <button className="btn btn-danger btn-sm" onClick={()=>remove(i)}>删除</button>
            </div>
            <div className="grid-form">
              <div><label>标题</label><input type="text" value={c.title} onChange={e=>update(i,'title',e.target.value)}/></div>
              <div><label>时长</label><input type="text" value={c.duration} onChange={e=>update(i,'duration',e.target.value)} placeholder="如 02:30"/></div>
              <div><label>描述</label><input type="text" value={c.desc} onChange={e=>update(i,'desc',e.target.value)}/></div>
              <div><label>背景色</label><input type="text" value={c.color} onChange={e=>update(i,'color',e.target.value)}/></div>
            </div>
            {/* 封面上传区 */}
            <div className={`upload-zone ${hasCover?'has-file':''}`} onClick={()=>!isCoverLoad && document.getElementById(`drCover-upload-${c.id}`).click()}>
              <input id={`drCover-upload-${c.id}`} type="file" accept="image/*" className="hidden" onChange={e=>handleDemoCover(c.id, e.target.files[0])}/>
              {isCoverLoad ? <div className="text-accent2 text-sm">上传中...</div> : hasCover ? <>
                <span className="text-accent2 text-sm">封面图片 — {state.demoCoverMedia?.[c.id]?.name || '已上传'}</span>
                {coverSrc && <img src={coverSrc} className="media-preview"/>}
              </> : <span className="text-muted text-sm">上传封面图片（用于播放列表缩略图）</span>}
            </div>
            {hasCover && <button className="btn btn-danger btn-sm w-full mt-2" onClick={()=>removeDemoCover(c.id)}>移除封面</button>}
            {/* 文件上传区 */}
            <div className={`upload-zone ${media?'has-file':''}`} onClick={()=>!isLoad && document.getElementById(`dr-upload-${c.id}`).click()}>
              <input id={`dr-upload-${c.id}`} type="file" accept="video/mp4,video/quicktime,video/webm,image/*" className="hidden" onChange={e=>handleDemoFile(c.id, e.target.files[0])}/>
              {isLoad ? <div className="text-accent2 text-sm">上传中...</div> : media ? <>
                <span className="text-accent2 text-sm">{media.type==='video'?'视频':media.type==='image'?'图片':'GIF'} — {media.name} ({(media.size/1024/1024).toFixed(1)}MB)</span>
                {media.type==='video' && src && <video src={src} className="media-preview" controls/>}
                {media.type==='image' && src && <img src={src} className="media-preview"/>}
                {media.type==='gif' && src && <img src={src} className="media-preview"/>}
              </> : <span className="text-muted text-sm">点击上传演示文件 (视频/图片)</span>}
            </div>
            {media && <button className="btn btn-danger btn-sm w-full mt-2" onClick={()=>removeDemoMedia(c.id)}>移除文件</button>}
          </div>
        )})}
      </div>
    </div>
  );
}

            <div className="flex items-center justify-between">
              <div className="flex items-center gap-2">
                <span className="drag-handle" draggable onDragStart={e=>{setDragIdx(i);e.dataTransfer.effectAllowed='move';}}>⋮⋮</span>
                <span className="font-bold text-sm">经历 #{i+1}</span>
              </div>
              <button className="btn btn-danger btn-sm" onClick={()=>remove(i)}>删除</button>
            </div>
            <div className="grid-form">
              <div><label>年份</label><input type="text" value={item.year} onChange={e=>update(i,'year',e.target.value)}/></div>
              <div><label>职位</label><input type="text" value={item.title} onChange={e=>update(i,'title',e.target.value)}/></div>
              <div><label>组织</label><input type="text" value={item.org} onChange={e=>update(i,'org',e.target.value)}/></div>
            </div>
            <div><label>描述</label><textarea value={item.desc} onChange={e=>update(i,'desc',e.target.value)}/></div>
          </div>
        ))}
      </div>
    </div>
  );
}

// ========== 联系方式管理（带拖拽排序） ==========
function ContactSection({state,setState}) {
  const [contacts, setContacts] = useState(()=>{
    const raw = state.contact;
    if (Array.isArray(raw)) return raw;
    // 兼容旧对象格式
    if (raw && typeof raw === 'object' && !Array.isArray(raw)) {
      const arr = [];
      if (raw.email) arr.push({id:1,label:'邮箱',type:'email',value:raw.email});
      if (raw.bilibili && raw.bilibili!=='#') arr.push({id:2,label:'Bilibili',type:'link',value:raw.bilibili});
      if (raw.xiaohongshu && raw.xiaohongshu!=='#') arr.push({id:3,label:'小红书',type:'link',value:raw.xiaohongshu});
      if (raw.vimeo && raw.vimeo!=='#') arr.push({id:4,label:'Vimeo',type:'link',value:raw.vimeo});
      return arr.length?arr:[{id:1,label:'邮箱',type:'email',value:'chenmo@example.com'}];
    }
    return [];
  });
  const setLabel = (i,v) => setContacts(s=>{const n=[...s]; n[i]={...n[i], label:v}; return n;});
  const setType = (i,v) => setContacts(s=>{const n=[...s]; n[i]={...n[i], type:v}; return n;});
  const setValue = (i,v) => setContacts(s=>{const n=[...s]; n[i]={...n[i], value:v}; return n;});
  const addContact = () => setContacts(s => [...s, {id:Date.now(), label:'新链接', type:'link', value:''}]);
  const removeContact = i => setContacts(s => s.filter((_,idx)=>idx!==i));
  useEffect(()=>{setState(s=>({...s, contact:contacts}))}, [contacts]);
  const [dragIdx, setDragIdx] = useState(null);
  const moveItem = (from, to) => setContacts(s => { const n = [...s]; const [rm] = n.splice(from, 1); n.splice(to, 0, rm); return n; });
  const handleDragOver = (e, i) => { e.preventDefault(); if (dragIdx !== null && dragIdx !== i) { moveItem(dragIdx, i); setDragIdx(i); } };
  const handleDragEnd = () => setDragIdx(null);
  const handleResume = e => {
    const f = e.target.files[0]; if (!f) return;
    setState(s=>({...s, resumeFile:{name:f.name, size:f.size}}));
  };
  return (
    <div className="section-card">
      <div className="section-title"><span>联系方式</span><button className="btn btn-primary btn-sm" onClick={addContact}>+ 添加</button></div>
      <p className="text-xs text-muted mb-4">拖动左侧手柄重新排序联系方式</p>
      <div className="space-y-3">
        {contacts.map((c,i)=>(
          <div key={c.id} className={`flex items-center gap-3 flex-wrap bg-surface p-2 rounded-md drag-item ${dragIdx===i?'opacity-40':''}`}
            onDragOver={e=>{e.preventDefault();}}
            onDragEnd={()=>setDragIdx(null)}
            onDrop={e=>{e.preventDefault();moveItem(dragIdx,i);setDragIdx(null);}}>
            <span className="drag-handle" draggable onDragStart={e=>{setDragIdx(i);e.dataTransfer.effectAllowed='move';}}>⋮⋮</span>
            <span className="text-xs text-muted w-5 text-right">{i+1}</span>
            <input type="text" value={c.label||''} onChange={e=>setLabel(i,e.target.value)} placeholder="名称" className="w-20"/>
            <select value={c.type||'link'} onChange={e=>setType(i,e.target.value)} className="w-16 text-xs">
              <option value="link">链接</option>
              <option value="email">邮箱</option>
            </select>
            <input type="text" value={c.value||''} onChange={e=>setValue(i,e.target.value)} placeholder={c.type==='email'?'邮箱地址':'URL'} className="flex-1 min-w-[150px]"/>
            <button className="btn btn-danger btn-sm" onClick={()=>removeContact(i)}>删除</button>
          </div>
        ))}
      </div>
      <div className="mt-6 pt-4 border-t border-muted2/20"><label>简历文件</label>
        <input type="file" accept=".pdf,.doc,.docx" onChange={handleResume}/>
        {state.resumeFile && <p className="text-xs text-accent2 mt-1">已上传: {state.resumeFile.name}</p>}
      </div>
    </div>
  );
}

function PwdSection({onLogout}) {
  const [pwd, setPwd] = useState('');
  const [cur, setCur] = useState('');
  const handleChange = () => {
    if (!cur) { showToast('请输入当前密码', true); return; }
    if (cur !== getPassword()) { showToast('当前密码错误', true); return; }
    if (!pwd || pwd.length < 3) { showToast('新密码至少3位', true); return; }
    setPassword(pwd);
    showToast('密码已更新');
    setPwd(''); setCur('');
  };
  return (
    <div className="section-card max-w-sm">
      <div className="section-title"><span>修改密码</span></div>
      <div className="space-y-3">
        <div><label>当前密码</label><input type="password" value={cur} onChange={e=>setCur(e.target.value)}/></div>
        <div><label>新密码</label><input type="password" value={pwd} onChange={e=>setPwd(e.target.value)}/></div>
        <button className="btn btn-primary w-full" onClick={handleChange}>更新密码</button>
      </div>
      <hr className="my-4 border-muted2/30"/>
      <button className="btn btn-danger w-full" onClick={onLogout}>退出登录</button>
    </div>
  );
}

function LoginScreen({onLogin, dbReady}) {
  const [pwd, setPwd] = useState('');
  const [err, setErr] = useState('');
  const [avatarUrl, setAvatarUrl] = useState(null);
  useEffect(() => {
    if (!dbReady) return;
    getMediaFromDB('avatar').then(r => { const u = getMediaDisplayURL(r); if (u) setAvatarUrl(u); }).catch(() => {});
  }, [dbReady]);
  const handleSubmit = e => {
    e.preventDefault();
    if (pwd === getPassword()) {
      sessionStorage.setItem(SESSION_KEY, '1');
      onLogin(true);
    } else { setErr('密码错误'); setPwd(''); }
  };
  return (
    <div className="min-h-screen flex items-center justify-center px-4">
      <div className="login-box text-center">
        <div className="w-20 h-20 rounded-full mx-auto mb-4 border-2 border-accent/20 shadow-md overflow-hidden bg-side flex items-center justify-center">
          {avatarUrl ? (
            <img src={avatarUrl} className="w-full h-full object-cover"/>
          ) : (
            <svg className="w-10 h-10 text-muted" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.5" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
          )}
        </div>
        <h1 className="text-2xl font-bold text-text mb-1">太阳_进击中后台</h1>
        <p className="text-xs text-muted mb-6">请输入密码以继续</p>
        <form onSubmit={handleSubmit}>
          <input type="password" value={pwd} onChange={e=>{setPwd(e.target.value); setErr('');}} placeholder="输入密码" className="mb-3 text-center" autoFocus/>
          {err && <p className="text-xs text-accent mb-2">{err}</p>}
          <button type="submit" className="btn btn-primary w-full">进入后台</button>
        </form>
      </div>
    </div>
  );
}

function App() {
  const [loggedIn, setLoggedIn] = useState(()=>sessionStorage.getItem(SESSION_KEY)==='1');
  const [state, setState] = useState(()=>loadState());
  const [activeTab, setActiveTab] = useState('personal');
  const [dbReady, setDbReady] = useState(false);
  const navRefs = useRef({});
  const [indicatorTop, setIndicatorTop] = useState(null);
  const saveRef = useRef(state);
  saveRef.current = state;

  useEffect(() => { initDB().then(() => setDbReady(true)).catch(e => showToast('数据库初始化失败: ' + e, true)); }, []);
  useLayoutEffect(() => {
    const el = navRefs.current[activeTab];
    if (el) setIndicatorTop(el.offsetTop);
  }, [activeTab]);

  useEffect(()=>{
    const timer = setTimeout(()=>{ const r = saveState(saveRef.current); if (!r.ok) showToast(r.error, true); }, 800);
    return ()=>clearTimeout(timer);
  }, [state]);

  const handleSave = ()=>{ const r = saveState(state); if (r.ok) showToast('已保存'); else showToast(r.error, true); };
  const handleReset = ()=>{ if (confirm('确定恢复默认？所有修改将丢失。')) { const ds = {...defaultState}; setState(ds); saveState(ds); showToast('已重置'); } };
  const handleLogout = () => { sessionStorage.removeItem(SESSION_KEY); setLoggedIn(false); };

  if (!loggedIn) return <LoginScreen onLogin={setLoggedIn} dbReady={dbReady}/>;

  const renderContent = () => {
    switch (activeTab) {
      case 'personal': return <PersonalSection state={state} setState={setState}/>;
      case 'carousel': return <CarouselSection state={state} setState={setState}/>;
      case 'portfolio': return <PortfolioSection state={state} setState={setState}/>;
      case 'demo': return <DemoReelSection state={state} setState={setState}/>;
      case 'skills': return <SkillsSection state={state} setState={setState}/>;
      case 'tags': return <TagsSection state={state} setState={setState}/>;
      case 'timeline': return <TimelineSection state={state} setState={setState}/>;
      case 'contact': return <ContactSection state={state} setState={setState}/>;
      case 'pwd': return <PwdSection onLogout={handleLogout}/>;
      default: return <div>请选择左侧菜单</div>;
    }
  };

  return (
    <div className="flex h-screen overflow-hidden">
      <div className="w-56 bg-side border-r border-muted2/40 p-4 flex flex-col gap-1 flex-shrink-0 overflow-y-auto" style={{position:'relative'}}>
        <div className="mb-6">
          <h1 className="text-lg font-bold text-text">太阳_进击中后台</h1>
          <p className="text-xs text-muted mt-1">动画师 / 视频剪辑师</p>
        </div>
        {indicatorTop !== null && <div className="nav-indicator" style={{top:indicatorTop}}></div>}
        {navItems.map(item=>(
          <div key={item.id} ref={el=>{navRefs.current[item.id]=el; if(el&&activeTab===item.id) requestAnimationFrame(()=>setIndicatorTop(el.offsetTop));}} className={`nav-item ${activeTab===item.id?'active':''} text-sm`} onClick={()=>setActiveTab(item.id)}>
            <svg fill="currentColor" viewBox="0 0 24 24"><path d={item.icon}/></svg>
            <span>{item.label}</span>
          </div>
        ))}
        <div className="mt-4 pt-3 border-t border-muted2/20">
          <div ref={el=>navRefs.current['pwd']=el} className={`nav-item text-sm ${activeTab==='pwd'?'active':''}`} onClick={()=>setActiveTab('pwd')}>
            <svg fill="currentColor" viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
            <span>安全设置</span>
          </div>
        </div>
        <div className="mt-4 flex gap-2">
          <button className="btn btn-primary flex-1 text-xs py-1.5" onClick={handleSave}>保存</button>
          <a href="resume.html" target="_blank" className="btn btn-secondary flex-1 text-xs py-1.5 text-center">预览</a>
        </div>
        <div className="mt-auto text-xs text-muted pt-4 border-t border-muted2/20">
          <button className="btn btn-danger btn-sm w-full" onClick={handleReset}>重置所有</button>
        </div>
      </div>
      <div className="flex-1 p-4 overflow-auto">
        {!dbReady && <div className="mb-3 p-2 bg-accent2/10 text-accent2 text-xs rounded">正在初始化媒体存储...</div>}
        {renderContent()}
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
